<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Always XX</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <!-- Fixed to the corner so it stays visible on every screen. -->
  <div class="lang-switch" id="lang-switch" role="group" aria-label="Language"></div>

  <div class="app">

    <!-- Step indicator, shown on the two setup screens -->
    <nav class="steps" id="steps">
      <span class="steps__item is-active" data-step="shape">
        <span class="steps__dot">1</span><span data-i18n="step.shape"></span>
      </span>
      <span class="steps__line" aria-hidden="true"></span>
      <span class="steps__item" data-step="mode">
        <span class="steps__dot">2</span><span data-i18n="step.mode"></span>
      </span>
    </nav>

    <!-- 1. Shape picker -->
    <section class="screen" data-screen="shape">
      <h1 class="screen__title" data-i18n="shape.title"></h1>
      <p class="screen__hint" data-i18n="shape.subtitle"></p>
      <div class="shape-grid-wrap">
        <div class="shape-grid" id="shape-grid"></div>
        <button class="shuffle" id="shape-shuffle" type="button" data-i18n-title="shape.shuffle" data-i18n-aria="shape.shuffle">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 3v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 16H3v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- 2. Mode picker -->
    <section class="screen" data-screen="mode" hidden>
      <h1 class="screen__title" data-i18n="mode.title"></h1>
      <p class="screen__hint" data-i18n="mode.hint"></p>
      <div class="mode-grid">
        <button class="mode-card" id="mode-auto" type="button">
          <canvas class="mode-card__demo" width="480" height="300"></canvas>
          <span class="mode-card__name" data-i18n="mode.auto"></span>
          <span class="mode-card__desc" data-i18n="mode.autoDesc"></span>
        </button>
        <button class="mode-card" id="mode-manual" type="button">
          <canvas class="mode-card__demo" width="480" height="300"></canvas>
          <span class="mode-card__badge" data-i18n="draw.morph"></span>
          <span class="mode-card__name" data-i18n="mode.manual"></span>
          <span class="mode-card__desc" data-i18n="mode.manualDesc"></span>
        </button>
      </div>
    </section>

    <!-- 3. Drawing -->
    <section class="screen screen--draw" data-screen="draw" hidden>
      <div class="stage__bg" aria-hidden="true">
        <h1 class="stage__title" id="stage-title"></h1>
        <p class="stage__hint" id="stage-hint"></p>
      </div>

      <canvas id="canvas" class="stage__canvas" role="img" data-i18n-aria="draw.title"></canvas>

      <div class="zoom" id="zoom" hidden>
        <span class="zoom__pct" id="zoom-pct">100%</span>
        <button class="zoom__reset" id="zoom-reset" type="button" data-i18n-title="draw.resetZoom" data-i18n-aria="draw.resetZoom">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="toolbar" id="toolbar">
        <div class="toolbar__palette" id="toolbar-palette"></div>
        <label class="swatch swatch--any" data-i18n-title="draw.anyColor">
          <input type="color" id="any-color" data-i18n-aria="draw.anyColor">
        </label>

        <span class="toolbar__divider" aria-hidden="true"></span>

        <button class="tool" id="tool-undo" type="button" disabled data-i18n-title="draw.undo" data-i18n-aria="draw.undo">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 14L4 9l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 9h10a6 6 0 0 1 0 12h-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="tool" id="tool-shape" type="button" data-i18n-title="draw.shape" data-i18n-aria="draw.shape">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3l4 6H8l4-6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <circle cx="7" cy="16" r="4" stroke="currentColor" stroke-width="1.8"/>
            <rect x="13" y="12.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
        <button class="tool" id="tool-settings" type="button" data-i18n-title="draw.settings" data-i18n-aria="draw.settings">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="tool" id="tool-morph" type="button" disabled data-i18n-title="draw.morph" data-i18n-aria="draw.morph">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2.5l2 6.5 6.5 2-6.5 2-2 6.5-2-6.5-6.5-2 6.5-2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="tool tool--record" id="tool-record" type="button" disabled data-i18n-title="draw.record" data-i18n-aria="draw.record">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3.2" fill="currentColor"/>
          </svg>
        </button>
        <button class="tool" id="tool-publish" type="button" disabled data-i18n-title="draw.publish" data-i18n-aria="draw.publish">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 16V4m0 0L8 8m4-4l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="tool" id="tool-save" type="button" disabled data-i18n-title="draw.save" data-i18n-aria="draw.save">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v11m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

        <span class="toolbar__divider" aria-hidden="true"></span>

        <button class="tool tool--danger" id="tool-clear" type="button" data-i18n-title="draw.clear" data-i18n-aria="draw.clear">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7h16M10 4h4M9 7v12M15 7v12M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Settings -->
    <div class="sheet" id="settings-sheet" hidden>
      <div class="sheet__backdrop" data-close="settings"></div>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header class="sheet__head">
          <h2 class="sheet__title" id="settings-title" data-i18n="settings.title"></h2>
          <button class="sheet__close" type="button" data-close="settings" data-i18n-aria="settings.close">×</button>
        </header>
        <div class="sheet__body">

          <section class="group">
            <h3 class="group__label" data-i18n="settings.mode"></h3>
            <div class="group__card">
              <button class="cell cell--pick" data-set-mode="auto" type="button">
                <span class="cell__text">
                  <span class="cell__title" data-i18n="mode.auto"></span>
                  <span class="cell__desc" data-i18n="mode.autoDesc"></span>
                </span>
                <span class="cell__check" aria-hidden="true">✓</span>
              </button>
              <button class="cell cell--pick" data-set-mode="manual" type="button">
                <span class="cell__text">
                  <span class="cell__title" data-i18n="mode.manual"></span>
                  <span class="cell__desc" data-i18n="mode.manualDesc"></span>
                </span>
                <span class="cell__check" aria-hidden="true">✓</span>
              </button>
            </div>
          </section>

          <section class="group">
            <h3 class="group__label" data-i18n="settings.palette"></h3>
            <div class="group__card">
              <div class="cell">
                <div class="palette-editor" id="palette-editor"></div>
              </div>
            </div>
            <p class="group__hint" data-i18n="settings.paletteHint"></p>
          </section>

          <section class="group">
            <h3 class="group__label" data-i18n="settings.minAspect"></h3>
            <div class="group__card">
              <div class="cell">
                <input id="min-aspect" class="slider" type="range" min="0" max="1" step="0.05">
                <span class="cell__value" id="min-aspect-value"></span>
              </div>
            </div>
            <p class="group__hint" data-i18n="settings.minAspectHint"></p>
          </section>

          <section class="group">
            <h3 class="group__label" data-i18n="settings.heightScale"></h3>
            <div class="group__card">
              <div class="cell">
                <input id="height-scale" class="slider" type="range" min="0.3" max="3" step="0.05">
                <span class="cell__value" id="height-scale-value"></span>
              </div>
            </div>
            <p class="group__hint" data-i18n="settings.heightScaleHint"></p>
          </section>

          <section class="group">
            <h3 class="group__label" data-i18n="settings.strokeWidth"></h3>
            <div class="group__card">
              <div class="cell">
                <input id="stroke-width" class="slider" type="range" min="1" max="12" step="0.5">
                <span class="cell__value" id="stroke-width-value"></span>
              </div>
              <div class="cell">
                <span class="cell__title" data-i18n="settings.preview"></span>
                <canvas id="width-preview" class="width-preview" width="220" height="40"></canvas>
              </div>
            </div>
          </section>

          <section class="group">
            <h3 class="group__label" data-i18n="settings.smooth"></h3>
            <div class="group__card">
              <label class="cell">
                <span class="cell__text">
                  <span class="cell__title" data-i18n="settings.smoothToggle"></span>
                  <span class="cell__desc" data-i18n="settings.smoothHint"></span>
                </span>
                <input id="smooth-enabled" class="switch" type="checkbox">
              </label>
              <div class="cell">
                <span class="cell__title" data-i18n="settings.smoothStrength"></span>
                <input id="smooth-strength" class="slider" type="range" min="0" max="1" step="0.1">
                <span class="cell__value" id="smooth-strength-value"></span>
              </div>
            </div>
          </section>

          <section class="group">
            <h3 class="group__label" data-i18n="settings.language"></h3>
            <div class="group__card">
              <div class="cell">
                <select id="locale-select" class="select"></select>
              </div>
            </div>
          </section>

          <section class="group">
            <div class="group__card">
              <button class="cell cell--action" id="settings-reset" type="button" data-i18n="settings.reset"></button>
            </div>
          </section>

          <section class="group">
            <h3 class="group__label" data-i18n="settings.about"></h3>
            <div class="group__card">
              <a class="cell cell--link" href="https://github.com/Stand404/Stand404.github.io" target="_blank" rel="noopener noreferrer">
                <span class="cell__text">
                  <span class="cell__title" data-i18n="settings.original"></span>
                  <span class="cell__desc" data-i18n="settings.originalDesc"></span>
                </span>
                <span class="cell__chevron" aria-hidden="true">›</span>
              </a>
            </div>
          </section>

        </div>
      </div>
    </div>

    <!-- Custom shape creator -->
    <div class="sheet" id="custom-sheet" hidden>
      <div class="sheet__backdrop" data-close="custom"></div>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="custom-title">
        <header class="sheet__head">
          <h2 class="sheet__title" id="custom-title" data-i18n="custom.title"></h2>
          <button class="sheet__close" type="button" data-close="custom" data-i18n-aria="custom.cancel">×</button>
        </header>
        <div class="sheet__body">

          <section class="group">
            <h3 class="group__label" data-i18n="custom.source"></h3>
            <div class="group__card">
              <label class="cell cell--action">
                <span data-i18n="custom.pickImage"></span>
                <input id="custom-file" type="file" accept="image/*,.svg" hidden>
              </label>
            </div>
            <p class="group__hint" data-i18n="custom.pickHint"></p>
          </section>

          <div class="trace-preview" id="trace-preview" hidden>
            <div class="trace-preview__box" id="trace-preview-box"></div>
            <p class="trace-preview__count" id="trace-count"></p>
          </div>

          <section class="group" id="trace-options" hidden>
            <h3 class="group__label" data-i18n="custom.traceSettings"></h3>
            <div class="group__card">
              <div class="cell">
                <span class="cell__title" data-i18n="custom.threshold"></span>
                <input id="trace-threshold" class="slider" type="range" min="0" max="1" step="0.02">
                <span class="cell__value" id="trace-threshold-value"></span>
              </div>
              <div class="cell">
                <span class="cell__title" data-i18n="custom.detail"></span>
                <input id="trace-detail" class="slider" type="range" min="0.4" max="4" step="0.2">
                <span class="cell__value" id="trace-detail-value"></span>
              </div>
              <div class="cell">
                <span class="cell__title" data-i18n="custom.smoothness"></span>
                <input id="trace-smooth" class="slider" type="range" min="0" max="6" step="0.2">
                <span class="cell__value" id="trace-smooth-value"></span>
              </div>
              <label class="cell">
                <span class="cell__title" data-i18n="custom.invert"></span>
                <input id="trace-invert" class="switch" type="checkbox">
              </label>
              <button class="cell cell--action" id="trace-auto" type="button" data-i18n="custom.autoThreshold"></button>
            </div>
          </section>

          <section class="group">
            <h3 class="group__label" data-i18n="custom.name"></h3>
            <div class="group__card">
              <div class="cell">
                <input id="custom-name" class="input" type="text" data-i18n-placeholder="custom.namePlaceholder">
              </div>
              <label class="cell">
                <span class="cell__title" data-i18n="custom.color"></span>
                <input id="custom-color" type="color" value="#64b5f6">
              </label>
            </div>
          </section>

          <section class="group" id="publish-group">
            <div class="group__card">
              <label class="cell">
                <span class="cell__text">
                  <span class="cell__title" data-i18n="publish.toggle"></span>
                  <span class="cell__desc" data-i18n="publish.hint"></span>
                </span>
                <input id="publish-toggle" class="switch" type="checkbox">
              </label>
              <div class="cell" id="publish-author-cell" hidden>
                <span class="cell__title" data-i18n="publish.author"></span>
                <input id="publish-author" class="input" type="text" data-i18n-placeholder="publish.authorPlaceholder">
              </div>
            </div>
            <p class="group__hint" data-i18n="publish.rules"></p>
          </section>

          <p class="sheet__error" id="custom-error" hidden></p>

          <div class="sheet__actions">
            <button class="btn btn--ghost" type="button" data-close="custom" data-i18n="custom.cancel"></button>
            <button class="btn btn--primary" id="custom-save" type="button" data-i18n="custom.save"></button>
          </div>

        </div>
      </div>
    </div>

    <!-- Community gallery -->
    <!-- Your own saved shapes -->
    <div class="sheet" id="my-shapes-sheet" hidden>
      <div class="sheet__backdrop" data-close="my-shapes"></div>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="my-shapes-title">
        <header class="sheet__head">
          <h2 class="sheet__title" id="my-shapes-title" data-i18n="myshapes.title"></h2>
          <button class="sheet__close" type="button" data-close="my-shapes" data-i18n-aria="settings.close">×</button>
        </header>
        <div class="sheet__body">
          <p class="gallery__status" id="my-shapes-status" hidden></p>
          <div class="gallery" id="my-shapes-list"></div>
          <button class="btn btn--primary" id="my-shapes-create" type="button" data-i18n="myshapes.create"></button>
        </div>
      </div>
    </div>

    <div class="sheet" id="gallery-sheet" hidden>
      <div class="sheet__backdrop" data-close="gallery"></div>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
        <header class="sheet__head">
          <h2 class="sheet__title" id="gallery-title" data-i18n="gallery.title"></h2>
          <button class="sheet__close" type="button" data-close="gallery" data-i18n-aria="settings.close">×</button>
        </header>

        <div class="segmented" role="tablist">
          <button class="segmented__item is-active" type="button" data-sort="new" data-i18n="gallery.sortNew"></button>
          <button class="segmented__item" type="button" data-sort="popular" data-i18n="gallery.sortPopular"></button>
        </div>

        <div class="sheet__body">
          <p class="gallery__status" id="gallery-status"></p>
          <div class="gallery" id="gallery-list"></div>
          <button class="btn btn--ghost" id="gallery-more" type="button" data-i18n="gallery.more" hidden></button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
